name: Actualizar RSS de Almirall

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

  push:
    branches:
      - main
    paths:
      - "almirall_rss.py"
      - ".github/workflows/actualizar-rss.yml"

permissions:
  contents: write

jobs:
  actualizar-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar RSS
        run: python almirall_rss.py

      - name: Guardar RSS actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git diff --cached --quiet || git commit -m "Actualizar RSS de Almirall"
          git push
